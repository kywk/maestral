name: Run tests

on:
  push:
    branches: [main]
  pull_request:
    paths:
      # run tests only when the python code or CI config has changed
      - 'src/**.py'
      - 'tests/**.py'
      - '.github/**'
  schedule:
    - cron: '30 3 * * SUN'
  workflow_dispatch:

jobs:
  offline-tests:
    name: offline
    strategy:
      fail-fast: false
      matrix:
        platform: [ubuntu-latest, macos-latest]
        python-version: ['3.11', '3.12', '3.13', '3.14']

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -U .[test]

      - name: Test with pytest
        run: |
          python -m pytest --cov=maestral --cov-report=term-missing tests/offline

# NOTE: upstream's linked-unit-tests and linked-integration-tests jobs are omitted
# on this fork. They authenticate against Dropbox test accounts using the
# DROPBOX_REFRESH_TOKEN_* secrets, which only exist in the upstream repository.
# They can be re-added with your own test-account tokens.
