[bumpversion]
current_version = 1.10.1
commit = True
tag = False
parse = ^
	(?P<major>\d+)\.(?P<minor>\d+)\.(?P<patch>\d+)
	(\.(?P<prekind>a|alpha|b|beta|d|dev|rc)
	(?P<pre>\d+)  # pre-release version num
	)?
	(\.(?P<postkind>post)(?P<post>\d+))?  # post-release
serialize = 
	{major}.{minor}.{patch}.{prekind}{pre}.{postkind}{post}
	{major}.{minor}.{patch}.{prekind}{pre}
	{major}.{minor}.{patch}.{postkind}{post}
	{major}.{minor}.{patch}

[bumpversion:part:prekind]
optional_value = _
values = 
	dev
	_

[bumpversion:part:postkind]
optional_value = _
values = 
	_
	post

# The maestral-qt and maestral-cocoa cross-dependency pins in pyproject.toml are
# frozen and must not be bumped with future maestral releases: upstream GUI
# packages stopped at 1.9.8 (maestral-qt) and 1.9.6 (maestral-cocoa). The
# substitution rule was therefore removed.
